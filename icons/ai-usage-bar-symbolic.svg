<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="currentColor">
    <!-- Neural network triangle: three nodes representing AI -->
    <circle cx="12" cy="3.5" r="2"/>
    <circle cx="5.5" cy="9.5" r="1.6"/>
    <circle cx="18.5" cy="9.5" r="1.6"/>
    <!-- Connecting edges between node surfaces -->
    <path fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"
          d="M10.53 4.86 L6.68 8.42 M13.47 4.86 L17.32 8.42 M7.1 9.5 L16.9 9.5"/>
    <!-- Panel / meter frame -->
    <rect x="1.5" y="13" width="21" height="9" rx="2.5"
          fill="none" stroke="currentColor" stroke-width="1.4"/>
    <!-- Session bar track + fill (75%) -->
    <rect x="3.5" y="15.2" width="17" height="2.3" rx="1.15" opacity="0.25"/>
    <rect x="3.5" y="15.2" width="12.75" height="2.3" rx="1.15"/>
    <!-- Weekly bar track + fill (40%) -->
    <rect x="3.5" y="18.8" width="17" height="2" rx="1" opacity="0.25"/>
    <rect x="3.5" y="18.8" width="6.8" height="2" rx="1"/>
  </g>
</svg>
