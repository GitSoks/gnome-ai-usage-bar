<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- Purple-to-blue gradient for AI nodes -->
    <linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <!-- Green gradient for session bar (healthy quota) -->
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <!-- Amber gradient for weekly bar (partial usage) -->
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Neural network triangle: three nodes representing AI -->
  <circle cx="12" cy="3.5" r="2" fill="url(#ng)"/>
  <circle cx="5.5" cy="9.5" r="1.6" fill="url(#ng)"/>
  <circle cx="18.5" cy="9.5" r="1.6" fill="url(#ng)"/>
  <!-- Connecting edges between node surfaces -->
  <path fill="none" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round"
        d="M10.53 4.86 L6.68 8.42 M13.47 4.86 L17.32 8.42 M7.1 9.5 L16.9 9.5"/>

  <!-- Panel / meter frame -->
  <rect x="1.5" y="13" width="21" height="9" rx="2.5"
        fill="none" stroke="#64748B" stroke-width="1.4"/>
  <!-- Session bar track + fill (75%) -->
  <rect x="3.5" y="15.2" width="17" height="2.3" rx="1.15" fill="#64748B" opacity="0.3"/>
  <rect x="3.5" y="15.2" width="12.75" height="2.3" rx="1.15" fill="url(#sg)"/>
  <!-- Weekly bar track + fill (40%) -->
  <rect x="3.5" y="18.8" width="17" height="2" rx="1" fill="#64748B" opacity="0.3"/>
  <rect x="3.5" y="18.8" width="6.8" height="2" rx="1" fill="url(#wg)"/>
</svg>
