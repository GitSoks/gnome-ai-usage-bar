<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- Session bar: green gradient -->
    <linearGradient id="sessionGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <!-- Weekly bar: blue gradient -->
    <linearGradient id="weeklyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <!-- Neural node: purple gradient -->
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>
  </defs>

  <!-- Bar tracks (background) -->
  <rect x="2.5" y="14.5" width="19" height="3" rx="1.5" fill="#6B7280" opacity="0.25"/>
  <rect x="2.5" y="19" width="19" height="2.2" rx="1.1" fill="#6B7280" opacity="0.25"/>

  <!-- Filled bars -->
  <rect x="2.5" y="14.5" width="14" height="3" rx="1.5" fill="url(#sessionGrad)"/>
  <rect x="2.5" y="19" width="8.5" height="2.2" rx="1.1" fill="url(#weeklyGrad)"/>

  <!-- Neural network: central node -->
  <circle cx="12" cy="5.5" r="2.5" fill="url(#nodeGrad)"/>
  <!-- Side nodes -->
  <circle cx="6" cy="9.5" r="1.8" fill="url(#nodeGrad)" opacity="0.9"/>
  <circle cx="18" cy="9.5" r="1.8" fill="url(#nodeGrad)" opacity="0.9"/>

  <!-- Connection lines -->
  <path fill="none" stroke="#A78BFA" stroke-width="1.2" stroke-linecap="round" opacity="0.5"
        d="M10 7L7.5 8.8M14 7L16.5 8.8M7.5 9.5h9"/>

  <!-- Small decorative accent -->
  <circle cx="20.5" cy="4" r="1.2" fill="#FBBF24" opacity="0.9"/>
  <circle cx="20.5" cy="4" r="0.5" fill="#FEF3C7"/>
</svg>